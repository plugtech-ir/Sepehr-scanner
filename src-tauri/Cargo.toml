[package]
name = "sepehr-scanner"
version = "1.0.0"
description = "Sepehr Scanner - Lightweight CF Scanner"
authors = ["Plugtech"]
edition = "2021"

[build-dependencies]
tauri-build = "2.0.0"

[dependencies]
tauri = { version = "2.0.0", features = ["mobile"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"